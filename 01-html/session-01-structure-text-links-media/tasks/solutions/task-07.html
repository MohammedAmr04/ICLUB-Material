<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images</title>
  </head>
  <body>
    <h1>Images</h1>

    <!-- 1. meaningful photo with real alt + reserved space -->
    <img
      src="roastery.jpg"
      alt="Roastery owner standing beside a red drum roaster"
      width="640"
      height="480"
    />

    <!-- 2. purely decorative -->
    <img src="divider.svg" alt="" />

    <!-- 3. below the fold, lazy -->
    <img
      src="beans.jpg"
      alt="Green coffee beans in an open burlap sack"
      width="1200"
      height="800"
      loading="lazy"
      decoding="async"
    />

    <!-- 4. responsive -->
    <img
      src="shop-800.jpg"
      srcset="shop-400.jpg 400w, shop-800.jpg 800w, shop-1600.jpg 1600w"
      sizes="(max-width: 600px) 100vw, 50vw"
      alt="The coffee shop counter during a busy morning"
      width="1600"
      height="1067"
    />
  </body>
</html>
