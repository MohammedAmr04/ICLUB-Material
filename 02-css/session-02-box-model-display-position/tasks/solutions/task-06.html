<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 6 - Border, Shadows & Overflow</title>
    <link rel="stylesheet" href="task-06.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-media">
        <img
          src="https://picsum.photos/seed/shadow/640/360"
          alt="Card media clipped to the rounded corners"
        />
      </div>
      <div class="card-body">
        <h2>Elevated card</h2>
        <p>Hover to elevate. The image is clipped by overflow: hidden.</p>
        <button class="btn" type="button">Focus me with Tab</button>
      </div>
    </div>

    <section class="hero">
      <h2>Clip-path hero</h2>
    </section>
  </body>
