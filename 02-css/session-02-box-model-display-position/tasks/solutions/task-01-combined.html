<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 — Fonts & Type Scale</title>
  
    <style>
/* system font stack: free, fast, native */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, sans-serif;

  /* modular type scale (1.2 ratio) */
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  padding: 1.5rem;
}

h1 {
  font-size: var(--text-2xl);
  line-height: 1.15;
  letter-spacing: -0.02em;
}

h2 {
  font-size: var(--text-xl);
  line-height: 1.25;
}

.body-text {
  font-size: var(--text-base);
  max-width: 40rem;
}

.caption {
  font-size: var(--text-sm);
  color: #64748b;
}

/*
  With a variable font instead of the system stack:

  @font-face {
    font-family: "Inter";
    src: url("fonts/inter.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  body { font-family: "Inter", var(--font-sans); }
*/
    </style>
</head>
  <body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <p class="body-text">
      Body text on a modular type scale with a system font stack and unitless
      line height.
    </p>
    <p class="caption">Caption / meta text</p>
  </body>
</html>
