<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - Opacity, Filters & Icons</title>
  
    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, sans-serif;
  line-height: 1.6;
  padding: 1.5rem;
  display: grid;
  gap: 1.5rem;
}

.card {
  max-width: 24rem;
  padding: 1rem;
  border: 1px solid #e2e8f0;
  border-radius: 0.5rem;
}

/* only the background fades - text untouched */
.faded-bg {
  background: rgb(0 71 255 / 0.08);
}

/* the whole element and its children fade */
.faded-all {
  opacity: 0.4;
}

/* grayscale to colour on hover */
.thumb {
  margin: 0;
  max-width: 400px;
}

.thumb img {
  display: block;
  width: 100%;
  border-radius: 0.5rem;
  filter: grayscale(100%);
  transition: filter 0.25s ease;
}

.thumb:hover img {
  filter: grayscale(0);
}

/* icon button inherits text colour via currentColor */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  font: inherit;
  color: #0f172a;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 0.5rem;
  cursor: pointer;
}

.btn:hover {
  filter: brightness(1.05);
}

.icon {
  width: 1.25rem;
  height: 1.25rem;
  fill: currentColor;
}
    </style>
</head>
  <body>
    <div class="card faded-bg">
      <h2>Background faded</h2>
      <p>Only the background uses alpha - the text stays fully readable.</p>
    </div>

    <div class="card faded-all">
      <h2>Whole card faded</h2>
      <p>opacity: 0.4 fades this text too.</p>
    </div>

    <figure class="thumb">
      <img
        src="https://picsum.photos/seed/css/400/240"
        alt="Demo photo in grayscale"
      />
      <figcaption>Hover me - colour returns</figcaption>
    </figure>

    <button class="btn" type="button" aria-label="Close">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M6 6l12 12M18 6L6 18"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
      </svg>
      <span>Close</span>
    </button>
  </body>
</html>
