<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4 - Sizing & Display</title>
    <link rel="stylesheet" href="task-04.css" />
  </head>
  <body>
    <div class="card">
      <div class="media">
        <img
          src="https://picsum.photos/seed/aspect/640/360"
          alt="16 by 9 demo"
        />
      </div>
      <div class="card-body">
        <h2>Sized card</h2>
        <p>max-width: 100% keeps it inside narrow containers.</p>
      </div>
    </div>

    <div class="actions">
      <button type="button">Save</button>
      <button type="button">Cancel</button>
    </div>

    <p>
      A <a href="#">link is inline</a> until it becomes
      <span class="tag">inline-block</span> with padding.
    </p>

    <div class="hidden-row">
      <span class="hide-none">display: none</span>
      <span class="hide-vis">visibility: hidden</span>
      <span class="hide-fade">opacity: 0 (still clickable)</span>
      <span>Visible</span>
    </div>
  </body>
</html>
